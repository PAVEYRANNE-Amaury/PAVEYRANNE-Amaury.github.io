project:
  type: website

website:
  title: "Amaury Paveyranne"
  description: "Biophysics, statistical inference and evolution: projects on public data"
  site-url: https://paveyranne-amaury.github.io
  navbar:
    right:
      - text: "Blog"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/PAVEYRANNE-Amaury
      - icon: translate
        aria-label: "Language"
        menu:
          - text: "English"
            href: "#lang=en"
          - text: "Français"
            href: "#lang=fr"

format:
  html:
    theme:
      light: [cosmo, theme-common.scss, theme-light.scss]
      dark: [darkly, theme-common.scss, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    include-after-body: lang-switch.html

lang: en



